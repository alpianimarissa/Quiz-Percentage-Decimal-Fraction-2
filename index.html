                question: "A bag contains 14 red counters, 11 blue counters, and 25 yellow counters. One counter is picked at random. What is the percentage probability that it is NOT blue?",
                unit: "%",
                acceptedAnswers: ["78", "78%"],
                steps: [
                    "<strong>Step 1:</strong> Total counters = 14 + 11 + 25 = 50.",
                    "<strong>Step 2:</strong> Number of counters that are NOT blue = 14 + 25 = 39.",
                    "<strong>Step 3:</strong> Convert 39/50 to a percentage: (39 &times; 2) / (50 &times; 2) = 78/100 = 78%.",
                    "<strong>Final Answer:</strong> 78%"
                ]
            },
            {
                id: 29,
                category: "Probability & Geometry",
                difficulty: "Intermediate",
                question: "A rectangle measures 12 cm by 5 cm. A square of side 3 cm is cut out from inside the rectangle. What percentage of the rectangle's original area was cut out?",
                unit: "%",
                acceptedAnswers: ["15", "15%"],
                steps: [
                    "<strong>Step 1:</strong> Area of the rectangle = 12 cm &times; 5 cm = 60 cm&sup2;.",
                    "<strong>Step 2:</strong> Area of the cut-out square = 3 cm &times; 3 cm = 9 cm&sup2;.",
                    "<strong>Step 3:</strong> Percentage cut out = (9 / 60) &times; 100% = (3 / 20) &times; 100% = 15%.",
                    "<strong>Final Answer:</strong> 15%"
                ]
            },
            {
                id: 30,
                category: "Probability & Geometry",
                difficulty: "Challenge",
                question: "A square has a side length of 10 cm. If each side length is increased by 20%, what is the percentage increase in the AREA of the square?",
                unit: "%",
                acceptedAnswers: ["44", "44%"],
                steps: [
                    "<strong>Step 1:</strong> Original area = 10 cm &times; 10 cm = 100 cm&sup2;.",
                    "<strong>Step 2:</strong> New side length after 20% increase = 10 cm + (20% of 10 cm) = 12 cm.",
                    "<strong>Step 3:</strong> New area = 12 cm &times; 12 cm = 144 cm&sup2;.",
                    "<strong>Step 4:</strong> Increase in area = 144 &minus; 100 = 44 cm&sup2; out of 100 cm&sup2; = 44%.",
                    "<strong>Final Answer:</strong> 44%"
                ]
            }
        ];

        // =========================================================================
        // STATE MANAGEMENT WITH LOCALSTORAGE (OFFLINE & RELOAD PERSISTENCE)
        // =========================================================================
        const STORAGE_KEY = 'cambridge_stage7_pct_quiz_v1';

        let appState = {
            currentIndex: 0,
            viewMode: 'single', // 'single' or 'all'
            answers: {} // { [questionId]: { userInput: string, status: 'correct' | 'incorrect' | 'draft' } }
        };

        function loadState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) {
                    const parsed = JSON.parse(saved);
                    appState = { ...appState, ...parsed };
                }
            } catch (e) {
                console.warn("Could not load state from localStorage:", e);
            }
        }

        function saveState() {
            try {
                localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                showSavePulse();
            } catch (e) {
                console.warn("Could not save state to localStorage:", e);
            }
        }

        function showSavePulse() {
            const el = document.getElementById('save-indicator');
            if (!el) return;
            el.classList.add('ring-2', 'ring-emerald-400');
            setTimeout(() => el.classList.remove('ring-2', 'ring-emerald-400'), 500);
        }

        // =========================================================================
        // ANSWER NORMALIZATION & VALIDATION LOGIC
        // =========================================================================
        function normalizeAnswer(str) {
            if (!str) return "";
            return str
                .toString()
                .trim()
                .toLowerCase()
                .replace(/\s+/g, ' ')         // Collapse multiple spaces
                .replace(/\s*\/\s*/g, '/')    // Normalize fraction slashes "17 / 25" -> "17/25"
                .replace(/\s*,\s*/g, ', ');   // Normalize commas
        }

        function checkQuestionAnswer(qId) {
            const q = questionsData.find(item => item.id === qId);
            const inputEl = document.getElementById(`input-q-${qId}`);
            if (!q || !inputEl) return;

            const rawVal = inputEl.value;
            const normVal = normalizeAnswer(rawVal);

            if (!normVal) {
                inputEl.focus();
                inputEl.classList.add('ring-2', 'ring-amber-400');
                setTimeout(() => inputEl.classList.remove('ring-2', 'ring-amber-400'), 800);
                return;
            }

            // Compare normalized user input against acceptedAnswers
            const isCorrect = q.acceptedAnswers.some(ans => normalizeAnswer(ans) === normVal);

            appState.answers[qId] = {
                userInput: rawVal,
                status: isCorrect ? 'correct' : 'incorrect'
            };

            saveState();
            renderAllUI();
        }

        function handleDraftInput(qId, value) {
            const existing = appState.answers[qId];
            // Save draft immediately on every keystroke so reload never loses typed text
            appState.answers[qId] = {
                userInput: value,
                status: existing && existing.status !== 'draft' ? existing.status : (value.trim() ? 'draft' : undefined)
            };
            if (!value.trim() && (!existing || existing.status === 'draft')) {
                delete appState.answers[qId];
            }
            saveState();
            updateSidebarStatsOnly();
        }

        function resetSingleQuestion(qId) {
            delete appState.answers[qId];
            saveState();
            renderAllUI();
        }

        function confirmReset() {
            if (confirm("Are you sure you want to clear all your answers and reset your score to 0?")) {
                appState.answers = {};
                appState.currentIndex = 0;
                saveState();
                renderAllUI();
            }
        }

        // =========================================================================
        // RENDERING & NAVIGATION
        // =========================================================================
        function setViewMode(mode) {
            appState.viewMode = mode;
            saveState();
            renderAllUI();
        }

        function jumpToQuestion(index) {
            appState.currentIndex = index;
            saveState();
            if (appState.viewMode === 'single') {
                renderAllUI();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            } else {
                renderAllUI();
                const targetCard = document.getElementById(`card-q-${questionsData[index].id}`);
                if (targetCard) {
                    targetCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
        }

        function navigateQuestion(delta) {
            const nextIdx = appState.currentIndex + delta;
            if (nextIdx >= 0 && nextIdx < questionsData.length) {
                appState.currentIndex = nextIdx;
                saveState();
                renderAllUI();
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        }

        function buildQuestionCardHTML(q) {
            const record = appState.answers[q.id] || {};
            const userInput = record.userInput || "";
            const status = record.status; // 'correct', 'incorrect', 'draft', or undefined

            let borderClass = "border-slate-200";
            let statusBanner = "";
            let solutionBlock = "";

            if (status === 'correct') {
                borderClass = "border-emerald-400 ring-1 ring-emerald-400/30";
                statusBanner = `
                    <div class="mt-4 p-3.5 rounded-xl bg-emerald-50 border border-emerald-200 flex items-center justify-between">
                        <div class="flex items-center space-x-2.5 text-emerald-800 font-bold text-sm">
                            <i class="fa-solid fa-circle-check text-emerald-600 text-lg"></i>
                            <span>Correct! Well done.</span>
                        </div>
                        <button onclick="resetSingleQuestion(${q.id})" class="text-xs font-semibold text-emerald-700 hover:underline">Try Again</button>
                    </div>
                `;
            } else if (status === 'incorrect') {
                borderClass = "border-rose-400 ring-1 ring-rose-400/30";
                statusBanner = `
                    <div class="mt-4 p-3.5 rounded-xl bg-rose-50 border border-rose-200 flex items-center justify-between">
                        <div class="flex items-center space-x-2.5 text-rose-800 font-bold text-sm">
                            <i class="fa-solid fa-circle-xmark text-rose-600 text-lg"></i>
                            <span>Incorrect. Review the worked solution below!</span>
                        </div>
                        <button onclick="resetSingleQuestion(${q.id})" class="text-xs font-semibold text-rose-700 hover:underline">Retry Question</button>
                    </div>
                `;
            }

            // Show detailed step-by-step worked solution immediately after checking
            if (status === 'correct' || status === 'incorrect') {
                solutionBlock = `
                    <div class="mt-4 bg-slate-50 border border-slate-200 rounded-xl p-4 space-y-2.5">
                        <div class="flex items-center justify-between">
                            <span class="text-xs font-bold uppercase tracking-wider text-slate-500">
                                <i class="fa-solid fa-list-check mr-1 text-cambridge-600"></i> Detailed Worked Solution
                            </span>
                            <span class="text-xs font-bold px-2 py-0.5 rounded bg-cambridge-100 text-cambridge-800">
                                Key Answer: ${q.acceptedAnswers[0]}
                            </span>
                        </div>
                        <div class="space-y-2">
                            ${q.steps.map(step => `
                                <div class="p-3 bg-white rounded-lg border border-slate-200 text-xs sm:text-sm text-slate-700 leading-relaxed">
                                    ${step}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }

            const diffBadgeClass = q.difficulty === 'Challenge' 
                ? 'bg-rose-100 text-rose-700' 
                : (q.difficulty === 'Intermediate' ? 'bg-amber-100 text-amber-800' : 'bg-slate-100 text-slate-600');

            return `
                <div id="card-q-${q.id}" class="bg-white p-6 rounded-2xl border ${borderClass} shadow-sm transition-all">
                    <!-- Header Metadata -->
                    <div class="flex flex-wrap items-center justify-between gap-2 mb-4">
                        <div class="flex items-center space-x-2">
                            <span class="px-3 py-1 bg-slate-900 text-white text-xs font-bold rounded-lg">Question ${q.id}</span>
                            <span class="text-xs font-semibold text-cambridge-600">${q.category}</span>
                        </div>
                        <span class="px-2.5 py-0.5 rounded-full text-xs font-semibold ${diffBadgeClass}">
                            ${q.difficulty}
                        </span>
                    </div>

                    <!-- Question Text -->
                    <p class="text-slate-900 font-semibold text-base sm:text-lg leading-relaxed mb-5">
                        ${q.question}
                    </p>

                    <!-- Essay / Short Answer Input Form -->
                    <div class="flex flex-col sm:flex-row gap-3">
                        <div class="relative flex-grow">
                            <input type="text" 
                                id="input-q-${q.id}" 
                                value="${userInput.replace(/"/g, '&quot;')}"
                                oninput="handleDraftInput(${q.id}, this.value)"
                                onkeydown="if(event.key === 'Enter') checkQuestionAnswer(${q.id})"
                                placeholder="Type your answer here..."
                                autocomplete="off"
                                class="w-full px-4 py-3 rounded-xl border border-slate-300 bg-slate-50 focus:bg-white text-slate-900 font-semibold text-sm sm:text-base focus:outline-none focus:ring-2 focus:ring-cambridge-500 focus:border-cambridge-500 transition"
                            >
                            ${q.unit ? `<span class="absolute right-3.5 top-1/2 -translate-y-1/2 text-xs font-bold text-slate-400 pointer-events-none">Unit: ${q.unit}</span>` : ''}
                        </div>
                        <button onclick="checkQuestionAnswer(${q.id})" 
                            class="px-6 py-3 rounded-xl bg-cambridge-600 hover:bg-cambridge-700 text-white font-bold text-sm shadow-sm transition flex items-center justify-center gap-2 shrink-0">
                            <i class="fa-solid fa-check"></i> Check Answer
                        </button>
                    </div>

                    ${statusBanner}
                    ${solutionBlock}
                </div>
            `;
        }

        function updateSidebarStatsOnly() {
            let correctCount = 0;
            let wrongCount = 0;

            questionsData.forEach(q => {
                const st = appState.answers[q.id]?.status;
                if (st === 'correct') correctCount++;
                if (st === 'incorrect') wrongCount++;
            });

            const checkedTotal = correctCount + wrongCount;
            const accuracy = checkedTotal > 0 ? Math.round((correctCount / checkedTotal) * 100) : 0;

            document.getElementById('score-display').textContent = correctCount;
            document.getElementById('answered-count').textContent = checkedTotal;
            document.getElementById('stat-correct').textContent = correctCount;
            document.getElementById('stat-wrong').textContent = wrongCount;
            document.getElementById('stat-accuracy').textContent = `${accuracy}%`;
            document.getElementById('progress-bar').style.width = `${(checkedTotal / questionsData.length) * 100}%`;

            // Render 30 Navigator Grid Buttons
            const navGrid = document.getElementById('nav-grid');
            navGrid.innerHTML = questionsData.map((q, idx) => {
                const st = appState.answers[q.id]?.status;
                const isActive = appState.viewMode === 'single' && appState.currentIndex === idx;

                let btnStyle = "bg-slate-100 text-slate-700 hover:bg-slate-200 border-transparent";
                if (st === 'correct') btnStyle = "bg-emerald-500 text-white hover:bg-emerald-600 border-emerald-600";
                else if (st === 'incorrect') btnStyle = "bg-rose-500 text-white hover:bg-rose-600 border-rose-600";
                else if (st === 'draft') btnStyle = "bg-amber-100 text-amber-900 border-amber-400";

                const activeRing = isActive ? "ring-2 ring-offset-2 ring-cambridge-600 font-extrabold scale-105" : "font-semibold";

                return `
                    <button onclick="jumpToQuestion(${idx})" 
                        class="h-9 rounded-lg border text-xs transition flex items-center justify-center ${btnStyle} ${activeRing}">
                        ${q.id}
                    </button>
                `;
            }).join('');
        }

        function renderAllUI() {
            const container = document.getElementById('quiz-container');
            const singleNav = document.getElementById('single-nav-controls');
            const btnSingle = document.getElementById('btn-mode-single');
            const btnAll = document.getElementById('btn-mode-all');

            if (appState.viewMode === 'single') {
                btnSingle.className = "px-3 py-1.5 rounded-lg bg-white text-cambridge-600 shadow-sm transition";
                btnAll.className = "px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition";
                singleNav.classList.remove('hidden');

                const currentQ = questionsData[appState.currentIndex];
                container.innerHTML = buildQuestionCardHTML(currentQ);

                document.getElementById('current-q-num').textContent = currentQ.id;
                document.getElementById('prev-btn').disabled = appState.currentIndex === 0;
                document.getElementById('next-btn').disabled = appState.currentIndex === questionsData.length - 1;
            } else {
                btnAll.className = "px-3 py-1.5 rounded-lg bg-white text-cambridge-600 shadow-sm transition";
                btnSingle.className = "px-3 py-1.5 rounded-lg text-slate-600 hover:text-slate-900 transition";
                singleNav.classList.add('hidden');

                container.innerHTML = questionsData.map(q => buildQuestionCardHTML(q)).join('');
            }

            updateSidebarStatsOnly();
        }

        // Initialize on page load
        window.addEventListener('DOMContentLoaded', () => {
            loadState();
            renderAllUI();
        });
    </script>
</body>
</html>
